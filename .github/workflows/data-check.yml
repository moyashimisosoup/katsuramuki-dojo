name: Validate project data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check source data syntax and references
        run: python3 tools/validate_data.py
      - name: Check Node version
        run: node --version
      - name: Run R0 cutting geometry tests
        run: npm test
      - name: Check Three.js module syntax
        run: |
          node --check src/main.js
          node --check src/view3d/geometry.js
          node --check src/view3d/scene.js
